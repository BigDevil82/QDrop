# Apache 2.4.47+; replace domain and certificate paths in your private server configuration.
# Required modules: proxy, proxy_http, ssl, headers, reqtimeout.
<VirtualHost *:80>
    ServerName qdrop.example.com
    Redirect permanent / https://qdrop.example.com/
    ErrorLog ${APACHE_LOG_DIR}/qdrop-error.log
    CustomLog /dev/null combined
</VirtualHost>

<VirtualHost *:443>
    ServerName qdrop.example.com
    SSLEngine on
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    LimitRequestBody 52428800
    RequestReadTimeout header=20-40,MinRate=500 body=120,MinRate=500
    TraceEnable Off
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Cache-Control "no-store"
    ProxyPass /v1/events http://127.0.0.1:18080/v1/events upgrade=websocket connectiontimeout=10 timeout=300
    ProxyPassReverse /v1/events http://127.0.0.1:18080/v1/events
    ProxyPass / http://127.0.0.1:18080/ connectiontimeout=10 timeout=300
    ProxyPassReverse / http://127.0.0.1:18080/
    ErrorLog ${APACHE_LOG_DIR}/qdrop-error.log
    CustomLog /dev/null combined
</VirtualHost>
